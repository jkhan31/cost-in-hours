<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message sent – Cost in Hours</title>
  <link rel="icon" type="image/png" href="icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
  <script>
    // Apply theme from localStorage
    (function() {
      const saved = localStorage.getItem('cost_in_hours_theme');
      if (saved === 'dark' || (saved === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200">
  <div class="max-w-md mx-auto px-6 text-center">
    <h1 class="text-3xl font-light mb-4 text-slate-900 dark:text-white">Message sent</h1>
    <p class="text-slate-500 dark:text-slate-400 mb-6">Thanks. Your message has been received.</p>
    <a href="/" class="inline-block px-6 py-3 bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 rounded-lg font-medium hover:bg-slate-800 dark:hover:bg-white transition-colors">
      Return to Cost in Hours
    </a>
  </div>
</body>
</html>
